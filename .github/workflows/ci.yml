name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint + PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, mbstring, libxml
          coverage: none
          tools: composer:v2
      - name: Lint every PHP file
        run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  studio:
    name: Studio — typecheck, Vitest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - name: Committed studio bundle matches the source
        run: |
          if ! git diff --quiet -- views/dist; then
            git --no-pager diff --stat -- views/dist
            echo "::error::views/dist is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

  e2e:
    name: E2E — PrestaShop ${{ matrix.ps }}
    runs-on: ubuntu-latest
    needs: [php, studio]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ps: ['9.2', '8.2']
    env:
      PS_IMAGE: prestashop/prestashop:${{ matrix.ps }}-apache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start PrestaShop and install Mega Builder
        run: bash tests/e2e/setup-store.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: PrestaShop logs
        if: failure()
        run: |
          docker compose -f tests/e2e/docker-compose.yml logs --tail=300 prestashop
          docker compose -f tests/e2e/docker-compose.yml exec -T prestashop sh -c 'tail -n 100 var/logs/*.log 2>/dev/null || true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-ps${{ matrix.ps }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
